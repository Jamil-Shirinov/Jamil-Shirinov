name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          username: Jamil-Shirinov
          card: stats
          path: generated/stats.svg
          options: >
            show_icons=true
            hide_border=true
            theme=transparent
            rank_icon=github

      - name: Generate languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          username: Jamil-Shirinov
          card: top-langs
          path: generated/languages.svg
          options: >
            layout=compact
            hide_border=true
            theme=transparent

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          git diff --cached --quiet || git commit -m "Update GitHub stats"
          git push